spring.application.name=booklibrary

# H2 in-memory DB, only for tests - keeps them isolated from the real Postgres data.
# This file replaces (not merges with) src/main/resources/application.properties
# when tests run, so everything the app needs at startup must be repeated here.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration - dummy secret, only valid for the lifetime of a test run
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1uZXZlci11c2UtaW4tcHJvZHVjdGlvbg==
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=604800000
